name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a SemVer tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          python3 scripts/check-release-tag.py "$RELEASE_TAG"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          digest-mismatch: error
          path: dist
      - name: Verify assets, upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ needs.build.outputs.commit }}
        run: |
          assets=()
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              extension=tar.gz
              if [[ "$os" = windows ]]; then extension=zip; fi
              assets+=("stunnel-cp_${RELEASE_TAG}_${os}_${arch}.${extension}")
            done
          done
          bash .github/scripts/publish-release.sh dist "${assets[@]}"
