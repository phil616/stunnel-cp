name: Build and test

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in packaged executables
        required: true
        type: string
    outputs:
      commit:
        description: Source commit used by all build jobs
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        name: Record source commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Check Go and release scripts
        run: |
          test -z "$(gofmt -l cmd internal web/embed.go)"
          go vet ./...
          go test -race ./...
          python3 -m unittest discover -s scripts -p '*_test.py'
          bash -n scripts/build-release.sh .github/scripts/publish-release.sh
      - name: Verify real stunnel mTLS forwarding and revocation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y stunnel4
          stunnel_bin=$(command -v stunnel4)
          STCP_STUNNEL_BIN="$stunnel_bin" go test -race ./internal/service -run TestStunnelMTLS -count=1 -v
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test browser workflows
        run: npm run test:e2e --prefix web
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Share verified frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Remove checked-in frontend output
        run: rm -rf web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: web/dist
          digest-mismatch: error
      - name: Build and archive
        env:
          BUILD_VERSION: ${{ inputs.version }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BUILD_COMMIT: ${{ needs.verify.outputs.commit }}
        run: bash scripts/build-release.sh "$BUILD_VERSION" "$TARGET_OS" "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
